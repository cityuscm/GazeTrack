[project]
name = "gazetrack-core"
version = "0.1.0"
description = "Core runtime library for GazeTrack"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aioreactive>=0.20.0",
  "anyio>=4.11.0",
  "asyncer>=0.0.10",
  "attrs>=25.4.0",
  "cyndilib>=0.0.9",
  "loguru>=0.7.3",
  "numba>=0.62.1",
  "opencv-contrib-python>=4.12.0.88",
  "pupil-labs-realtime-api>=1.7.3",
  "python-osc>=1.9.3",
  "returns>=0.26.0",
  "tenacity>=9.1.2",
  "torch>=2.9.1",
  "torchvision>=0.24.1",
  "tqdm>=4.67.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gazetrack_core"]
