[project]
name = "gazetrack-web"
version = "0.1.0"
description = "FastAPI backend for GazeTrack web interface"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.121.2",
    "pydantic>=2.12.4",
    "gazetrack-core",
]

[tool.uv.sources]
gazetrack-core = { workspace = true }

[project.scripts]
gazetrack-web = "gazetrack_web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
ignore-vcs = true
packages = ["src/gazetrack_web"]

[tool.hatch.build.targets.binary]
python-version = "3.13"
