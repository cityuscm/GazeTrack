name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: gazetrack-*
          merge-multiple: true
          path: release-artifacts

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && '' || github.ref_name }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: release-artifacts/**/*
