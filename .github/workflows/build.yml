name: Build

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "justfile"
      - "!.github/**"
      - "!README.md"
      - "!CITATION.cff"
      - "!vscode.code-workspace"
      - "!**/*.md"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "justfile"
      - "!.github/**"
      - "!README.md"
      - "!CITATION.cff"
      - "!vscode.code-workspace"
      - "!**/*.md"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('backend/pyproject.toml', 'frontend/package.json', 'frontend/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: install just
        uses: extractions/setup-just@v3

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: check rust version
        run: rustc --version

      - name: setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: install fd
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: fd-find@10.3.0

      - name: verify tools
        run: |
          echo "Bun version:"
          bun --version
          echo "UV version:"
          uv --version
          echo "Just version:"
          just --version
          echo "FD version:"
          fd --version

      - name: setup hatch
        run: uv tool install hatch

      - name: sync dependencies
        run: |
          just sync

      - name: build
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: |
          just build-dist

      - name: upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: gazetrack-${{ matrix.os }}-python${{ matrix.python-version }}
          path: |
            backend/packages/web/dist/binary/**
          retention-days: 30

      - name: cleanup
        if: always()
        run: just clean
