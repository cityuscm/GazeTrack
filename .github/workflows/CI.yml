name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            ~/.bun/install/cache
            frontend/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('backend/pyproject.toml', 'frontend/package.json', 'frontend/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install fd
        uses: taiki-e/install-action@v2
        with:
          tool: sharkdp/fd@latest

      - name: Check for required tools
        run: |
          echo "Bun version:"
          bun --version
          echo "UV version:"
          uv --version
          echo "Just version:"
          just --version
          echo "FD version:"
          fd --version

      - name: Sync dependencies
        run: |
          just sync

      - name: Build project
        run: |
          just build-dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: gazetrack-${{ matrix.os }}-python${{ matrix.python-version }}
          path: |
            /backend/packages/web/dist/binary
          retention-days: 30

      - name: Clean up
        if: always()
        run: just clean
